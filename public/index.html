<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Playlist Grouper — Spotify</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎧 Playlist Grouper</h1>
    <p class="subtitle">Group your Spotify Liked Songs by month or season, and turn any group into a playlist.</p>
  </header>

  <main>
    <section id="login-section">
      <a href="/login" class="btn primary">Connect with Spotify</a>
    </section>

    <section id="app-section" hidden>
      <div class="controls">
        <span id="who"></span>
        <div class="control-row">
          <label>Source:
            <select id="source">
              <option value="liked">Liked Songs (by date added)</option>
              <option value="recent">Recently Played (last ~50)</option>
            </select>
          </label>
          <label>Group by:
            <select id="groupBy">
              <option value="month">Month</option>
              <option value="season">Season</option>
            </select>
          </label>
          <button id="loadBtn" class="btn primary">Sort my songs</button>
        </div>
      </div>

      <div id="status"></div>
      <div id="groups"></div>
    </section>
  </main>

  <div id="group-selection-bar" hidden>
    <span id="group-selection-count">0 groups selected</span>
    <select id="group-selection-target" class="playlist-target"><option value="">+ New playlist</option></select>
    <input id="group-selection-name" type="text" placeholder="Playlist name" />
    <button id="group-selection-create-btn" class="btn primary">Create playlist</button>
    <button id="group-selection-clear-btn" class="btn ghost">Clear</button>
    <span id="group-selection-result"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
